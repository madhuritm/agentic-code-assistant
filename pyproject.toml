[project]
name = "agentic-code-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "madhuri",email = "madhuritm.91@gmail.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "python-dotenv (>=1.2.3,<2.0.0)",
    "openai (>=3.19.0,<4.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain (>=1.4.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-openai (>=1.6.5,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-anthropic (>=1.7.4,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-huggingface (>=1.2.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "tree-sitter-language-pack (>=1.20.0,<2.0.0)",
    "langchain-qdrant (>=1.1.0,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "fastembed (>=0.9.0,<0.10.0)",
    "langgraph-checkpoint-sqlite (>=3.1.2,<4.0.0)"
]



[tool.poetry]
packages = [{include = "coding_assistant"}]


[tool.poetry.scripts]
coding_assistant = "coding_assistant.main:run"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
